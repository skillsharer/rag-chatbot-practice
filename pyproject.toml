[project]
name = "rag-chatbot-practice"
version = "1.0.0"
description = "A rag chatbot based on Langgraph."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "langgraph>=1.2.11",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.62.0",
    "transformers<5.4",
    "torch"
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]