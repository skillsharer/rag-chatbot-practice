[project]
name = "rag-chatbot-practice"
version = "1.0.0"
description = "A rag chatbot based on Langgraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.61.1",
    "langchain-core>=1.5.4",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.1",
    "ollama>=0.6.2",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "torchvision>=0.28.0",
]
[tool.setuptools.packages.find]
where = ["src"]
